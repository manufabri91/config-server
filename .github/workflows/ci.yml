name: Build and security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '13 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Test inventory coverage and failure handling
        run: python3 scripts/test_security_inventory.py
      - name: Inventory application, test and executed plugin dependencies
        run: python3 scripts/security_inventory.py
      - name: Scan selected runtime, test and plugin JARs
        id: maven-scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          scan-type: rootfs
          scan-ref: security-inventory
          scanners: vuln
          format: json
          output: security-reports/maven-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Reject an empty Java scan
        if: always() && steps.maven-scan.outcome != 'skipped'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('security-reports/maven-vulnerabilities.json').read_text())
          if not any(result.get('Type') == 'jar' and result.get('Packages') for result in report.get('Results', [])):
              raise SystemExit('No Java packages were detected; refusing an empty security scan.')
          PY
      - name: Retain selected dependency inventory and scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-server-dependency-security
          path: security-reports/
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: maven
      - name: Verify compatibility against isolated Git fixtures
        run: mvn -B verify
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-server-test-reports
          path: target/surefire-reports/
          retention-days: 30

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build patched runtime image
        run: docker build --pull --tag config-server:security .
      - name: Scan final image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          image-ref: config-server:security
          scanners: vuln
          format: json
          output: image-vulnerabilities.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Generate runtime SBOM
        if: always()
        run: trivy image --format cyclonedx --output image-sbom.cdx.json config-server:security
      - name: Retain image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-server-security-reports
          path: |
            image-vulnerabilities.json
            image-sbom.cdx.json
          retention-days: 30
